<style>
:root{--bg:#080807;--gold:#d8b56a;--gold-light:#f1d99e;--cream:#f7f0df;--muted:#c8b98f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 16px;display:flex;align-items:center;justify-content:center;
background:radial-gradient(ellipse at 50% 0%,#3b2b13 0%,#17120a 34%,var(--bg) 76%);
color:var(--cream);font-family:Georgia,'Times New Roman',serif}
main{width:min(100%,440px);padding:30px 22px 26px;text-align:center;border:1px solid #9c783b;border-radius:22px;

.logo{width:190px;height:150px;object-fit:contain;margin:0 auto 8px;display:block}

.tag{margin:0 0 24px;color:var(--muted);font:11px Arial,sans-serif;letter-spacing:.23em}
.links{display:grid;gap:12px}
a{display:flex;align-items:center;justify-content:center;min-height:54px;padding:14px 16px;border:1px solid #9c783b;
border-radius:12px;color:var(--gold-light);text-decoration:none;font:600 14px Arial,sans-serif;letter-spacing:.07em;
background:linear-gradient(110deg,#171209,#0b0b09);transition:.2s}
a:active{transform:scale(.98);background:#30230f}
a.primary{background:linear-gradient(110deg,#d8b56a,#9b7130);color:#100d07;border:0}
footer{margin-top:22px;color:#a99468;font:11px Arial,sans-serif;letter-spacing:.08em;line-height:1.8}
</style>
